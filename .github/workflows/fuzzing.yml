# This workflow will perform a fuzzer-run

name: Run Fuzzing

# https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/
on:
    workflow_dispatch:

jobs:
  fuzzing:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: '17'
        check-latest: true

    - name: Cache Gradle wrapper and dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/corpus
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Verify Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build the fuzz target
      run: ./gradlew shadowJar

    - name: Fetch initial corpus
      run: |
        set -eu
        git clone --depth=1 https://github.com/apache/poi.git repo
        cd repo
        mv test-data ../corpus
        echo "Using commit $(git rev-parse HEAD)"

    - name: Fetch Jazzer
      run: wget https://github.com/CodeIntelligenceTesting/jazzer/releases/download/v0.30.0/jazzer-linux.tar.gz

    - name: Unpack Jazzer
      run: tar xzf jazzer-*.tar.gz

    - name: Run Fuzzing - POIFuzzer
      run: ./jazzer --cp=build/libs/poi-fuzz-all.jar --instrumentation_includes=org.apache.poi.**:org.apache.xmlbeans.** --target_class=org.dstadler.poi.fuzz.POIFuzzer -rss_limit_mb=4096 -timeout=600 corpus
